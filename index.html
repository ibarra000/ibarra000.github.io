    <!--
      Scoped to frame-src on purpose. A default-src here would also apply in
      dev, where Vite's HMR needs inline scripts, eval and a websocket -- so it
      would have to be widened until it meant nothing. frame-src IS honored in
      meta form (unlike frame-ancestors or report-uri), which makes this a real
      second control alongside the allowlist in src/lib/embed.js. Adding a host
      means editing BOTH places.
    -->

      http-equiv="Content-Security-Policy"
      content="frame-src https://cap.so https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'"
    />
